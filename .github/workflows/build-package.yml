name: Build Package

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout public submodules
        run: git submodule update --init --recursive libs/cppjieba/deps/limonp

      - name: Checkout optional solutions submodule
        shell: bash
        run: |
          git submodule update --init --recursive solutions || true

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package
          -DMCDK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --config Release --target all --parallel

      - name: Install
        run: cmake --install build/ci --config Release

      - name: Verify installed package
        shell: bash
        run: |
          test -d package/dicts
          test ! -d package/knowledge
          test -f package/mcdk_index_cache.bin
          test -f package/mcdk_sapi_index_cache.bin

          test -f package/mcdk-assistant
          test -f package/mcdk-asst-lite
          test -f package/mcdk-asst-server

          if [ -f solutions/cpp/solution_index.cpp ]; then
            test -f package/mcdk_solutions_cache.bin
          else
            test ! -f package/mcdk_solutions_cache.bin
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcdk-assistant-linux-x64
          path: package/
