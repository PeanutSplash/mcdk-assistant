name: Build Package

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu GCC
    runs-on: ubuntu-latest
    # 在 20.04 容器内构建，把二进制的 glibc 依赖压到 2.31，
    # 以便在仍使用 glibc 2.31 的部署机上直接运行。
    container:
      image: ubuntu:20.04

    steps:
      # 容器里以 root 运行，没有 sudo；checkout 之前必须先装好 git。
      - name: Install Linux build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            binutils \
            cmake \
            curl \
            g++-10 \
            gcc-10 \
            git \
            make \
            ninja-build \
            python3
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout public submodules
        run: git submodule update --init --recursive libs/cppjieba/deps/limonp

      - name: Checkout optional solutions submodule
        shell: bash
        run: |
          git submodule update --init --recursive solutions || true

      # glibc 2.34 起 libdl / libpthread 已并入 libc，在 2.31 上仍是独立库：
      # pocketpy 需要 dlopen/dlsym，mcdk-python-review 需要 pthread_create。
      - name: Configure
        run: >
          cmake -S . -B build/ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=$PWD/package
          -DCMAKE_CXX_STANDARD_LIBRARIES="-ldl -lpthread"
          -DMCDK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --config Release --target all --parallel

      - name: Install
        run: cmake --install build/ci --config Release

      - name: Verify installed package
        shell: bash
        run: |
          test -d package/dicts
          test ! -d package/knowledge
          test -f package/mcdk_index_cache.bin
          test -f package/mcdk_sapi_index_cache.bin

          test -f package/mcdk-assistant
          test -f package/mcdk-asst-lite
          test -f package/mcdk-asst-server

          if [ -f solutions/cpp/solution_index.cpp ]; then
            test -f package/mcdk_solutions_cache.bin
          else
            test ! -f package/mcdk_solutions_cache.bin
          fi

      - name: Verify glibc compatibility
        shell: bash
        run: |
          set -euo pipefail
          max_allowed=2.31
          status=0
          for bin in mcdk-assistant mcdk-asst-lite mcdk-asst-server; do
            required=$(objdump -T "package/$bin" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sed 's/^GLIBC_//' \
              | sort -uV \
              | tail -1)
            highest=$(printf '%s\n%s\n' "$max_allowed" "$required" | sort -V | tail -1)
            if [ "$highest" != "$max_allowed" ]; then
              echo "::error::$bin requires glibc $required, exceeds the $max_allowed baseline"
              status=1
            else
              echo "$bin requires glibc $required (<= $max_allowed)"
            fi
          done
          exit $status

      # 打成单个 tarball：既是 release 资产，也是交给 release job 的中间产物。
      # -C package . 让归档在根部展开（dicts/、*.bin、二进制平铺），
      # 与上游 release zip 的布局一致，服务器解压方式无需改。
      - name: Package release tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -czf mcdk-assistant-linux-x64.tar.gz -C package .
          ls -lh mcdk-assistant-linux-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcdk-assistant-linux-x64
          path: mcdk-assistant-linux-x64.tar.gz
          retention-days: 7
          # tarball 已是 gzip，无需再压一层。
          compression-level: 0

  release:
    name: Publish rolling release
    needs: build
    # 只有 main 分支的推送、或手动触发，才更新 latest release；
    # 特性分支的推送只产出 artifact，不动 release。
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: mcdk-assistant-linux-x64

      # 删除旧的 latest release 及其 tag，再在当前 commit 上重建，
      # 保证 tag 始终指向最新构建，而下载地址恒定不变。
      # 服务器可匿名 curl：
      #   https://github.com/<repo>/releases/latest/download/mcdk-assistant-linux-x64.tar.gz
      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/mcdk-assistant-linux-x64.tar.gz"
          {
            echo "自动构建于 commit $short_sha。glibc 基线 2.31，可直接在 Ubuntu 20.04 部署机运行。"
            echo ""
            echo "匿名下载（地址恒定）：$asset_url"
          } > release-notes.md
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($short_sha)" \
            --notes-file release-notes.md \
            --latest \
            mcdk-assistant-linux-x64.tar.gz

  # 发布后经 Tailscale 连入内网、SSH 触发服务器立即拉取新构建（每日轮询仍作兜底）。
  # 需仓库变量 SERVER_PUSH_UPDATE=true 才启用——配置齐全后再打开，避免半配置时 job 报错。
  # 另需 secrets TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET，且 tailnet ACL 放通 tag:ci → 服务器 root。
  trigger-update:
    name: Trigger server update
    needs: release
    if: >
      vars.SERVER_PUSH_UPDATE == 'true'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Tailscale SSH 按 tailnet 身份鉴权，无需 SSH 私钥。服务器脚本自身幂等，
      # 直接调用即可；下载走代理约 1-2 分钟，前台等待以便 CI 反映成败。
      - name: Run the update on the server
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o BatchMode=yes \
                 root@100.84.150.108 '/usr/local/sbin/mcdk-assistant-update'; then ok=1; break; fi
            echo "SSH attempt $i failed; retrying in 5s..." >&2; sleep 5
          done
          [ "$ok" = 1 ]
